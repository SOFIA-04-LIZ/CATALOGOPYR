<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Pruebas del catálogo</title>
<body>
<pre id="result">RUNNING</pre>
<iframe id="app" title="Catálogo en pruebas" style="width:1280px;height:900px;border:0"></iframe>
<script>
const frame = document.getElementById('app');
const result = document.getElementById('result');
const assert = (condition, message) => {
    if (!condition) throw Error(message);
    checks++;
};
const pages = ['index', 'EPP', 'LIMPIEZA', 'LUBRICANTES', 'PAPELERIA', 'QUIMICOS', 'REFACCIONES', 'SOLVENTES', 'UNIFORMES', 'GASES', 'ADHESIVOS', 'PINTURAS', 'HERRAMIENTAS', 'INSUMOS', 'CONSUMIBLES'];
let index = 0;
let checks = 0;
let failed = false;
function fail(error) {
    failed = true;
    result.textContent = 'FAIL: ' + (error.stack || error);
}
frame.onload = () => {
    if (failed) return;
    try {
        const w = frame.contentWindow, d = w.document;
        w.addEventListener('error', event => fail(event.message));
        assert(typeof w.buscarProducto === 'function', pages[index] + ': scripts initialized');
        assert(!!d.querySelector('.card:not([hidden])'), pages[index] + ': catalog has materials');
        assert(!d.querySelector('.catalog-filters, #result-count, .catalog-heading'), 'no lower filter block');
        assert(d.querySelector('nav').contains(d.getElementById('categories-menu')), 'categories stay in top navigation');
        const toggle = d.querySelector('.categories-toggle');
        const menu = d.getElementById('categories-menu');
        const categoryLabel = d.getElementById('current-category');
        const activeCategory = menu.querySelector('[aria-current="page"]');
        assert(categoryLabel.textContent === (activeCategory ? activeCategory.textContent : 'Inicio · Todos los materiales'), 'current category label matches the navigation');
        assert(menu.hidden, 'category menu initially closed');
        toggle.click();
        assert(!menu.hidden && toggle.getAttribute('aria-expanded') === 'true', 'category menu opens');
        assert(w.getComputedStyle(menu).display !== 'none', 'category menu is visible');
        assert(menu.querySelectorAll('a').length === 14, 'all category links are present');
        d.dispatchEvent(new w.KeyboardEvent('keydown', {key: 'Escape', bubbles: true}));
        assert(menu.hidden, 'Escape closes category menu');
        toggle.click();
        d.body.click();
        assert(menu.hidden, 'outside click closes category menu');
        d.querySelector('.cart-container').click();
        assert(w.getComputedStyle(d.getElementById('cart-panel')).display === 'block', 'cart opens on first click');
        if (index > 0) assert(d.getElementById('cart-count').textContent === '1', 'cart persists across pages');
        w.vaciarCarrito();
        for (const card of d.querySelectorAll('.card')) {
            const variants = JSON.parse(card.dataset.variants);
            const selector = card.querySelector('.variant-select');
            assert(!!selector === (variants.length > 1), 'only materials with variants have a dropdown');
            for (const variant of variants) {
                if (selector) {
                    selector.value = variant.sku;
                    selector.dispatchEvent(new w.Event('change'));
                }
                assert(card.querySelector('.sku-display').textContent === 'SKU: ' + variant.sku, 'selected SKU: ' + variant.sku);
                assert(card.querySelector('img').getAttribute('src') === variant.image, 'selected image: ' + variant.sku);
                assert(card.querySelector('img').alt === variant.name, 'image description matches selection');
                assert(card.querySelector('.product-note').hidden === !variant.note, 'note belongs to selected option');
                assert(card.querySelector('.product-unit').textContent === (variant.unit ? 'Unidad: ' + variant.unit : ''), 'unit matches selected option');
                w.agregarAlCarrito(card.querySelector('button'));
                assert(d.querySelector('.cart-sku').textContent === 'SKU: ' + variant.sku, 'cart SKU: ' + variant.sku);
                assert(d.querySelector('.cart-nombre').textContent === variant.cart_name, 'cart identifies original material and size');
                assert(d.querySelector('.cart-img').getAttribute('src') === variant.image, 'cart image matches option');
                w.vaciarCarrito();
            }
        }
        const search = d.getElementById('buscador');
        if (pages[index] === 'index') {
            for (const sku of ['5506472', '5539469', '5517584', '5526770', '5537478', '4024834', '5541902', '5544109']) {
                search.value = sku;
                w.buscarProducto();
                const found = d.querySelectorAll('.card:not([hidden])');
                assert(found.length === 1, 'SKU finds a single grouped card: ' + sku);
                assert(found[0].querySelector('.sku-display').textContent === 'SKU: ' + sku, 'search selects matching variant: ' + sku);
            }
            search.value = 'quimicos'; w.buscarProducto();
            assert(!!d.querySelector('.card:not([hidden])'), 'search works without accents');
            search.value = 'casco infracap verde'; w.buscarProducto();
            assert(d.querySelector('.card:not([hidden]) .variant-select').value === '5526770', 'original color-specific names remain searchable');
        }
        search.value = 'zzzz-no-match'; w.buscarProducto();
        assert(!d.querySelector('.card:not([hidden])'), 'search hides nonmatches');
        assert(!d.getElementById('sin-resultados').hidden, 'empty search state');
        search.value = ''; w.buscarProducto();
        assert(d.getElementById('sin-resultados').hidden, 'clearing search restores catalog');
        // Verify the requested three-column minimum across phones and tablets.
        for (const width of [320, 360, 375, 390, 430, 600, 768, 1024, 1280, 1440]) {
            frame.style.width = width + 'px';
            const footer = d.querySelector('footer');
            const content = d.getElementById('catalog-content');
            assert(content.clientHeight > 0, 'catalog has a scrollable viewport at ' + width + 'px');
            assert(content.getBoundingClientRect().bottom <= footer.getBoundingClientRect().top + 1, 'footer has separate space at ' + width + 'px');
            assert(footer.scrollHeight <= footer.clientHeight, 'footer text fits at ' + width + 'px');
            for (const scrollTop of [0, content.scrollHeight / 2, content.scrollHeight]) {
                content.scrollTop = scrollTop;
                const footerRect = footer.getBoundingClientRect();
                assert(Math.abs(footerRect.bottom - w.innerHeight) < 1 && footerRect.top >= 0, 'footer stays visible while scrolling at ' + width + 'px');
                const painted = d.elementFromPoint(w.innerWidth / 2, footerRect.top + footerRect.height / 2);
                assert(painted === footer || footer.contains(painted), 'footer is actually painted above the catalog at ' + width + 'px');
            }
            search.value = 'zzzz-no-match'; w.buscarProducto();
            assert(Math.abs(footer.getBoundingClientRect().bottom - w.innerHeight) < 1, 'footer stays at bottom with no results');
            search.value = ''; w.buscarProducto();
            content.scrollTop = 0;
            const grid = d.getElementById('catalogo');
            const columns = w.getComputedStyle(grid).gridTemplateColumns.split(' ').length;
            assert(columns >= 3, 'at least three columns at ' + width + 'px');
            assert(d.documentElement.scrollWidth <= d.documentElement.clientWidth, 'no horizontal overflow at ' + width + 'px');
            const logo = d.querySelector('.logo-container');
            assert(d.querySelector('nav').contains(logo), 'logo belongs to navigation');
            const logoRect = logo.getBoundingClientRect();
            const navRect = d.querySelector('nav .menu').getBoundingClientRect();
            assert(logoRect.left >= navRect.right, 'logo does not overlap navigation at ' + width + 'px');
            assert(logoRect.right <= width, 'logo fits viewport at ' + width + 'px');
            const titleRange = d.createRange();
            titleRange.selectNodeContents(d.querySelector('header h1'));
            const cartRect = d.querySelector('.cart-container').getBoundingClientRect();
            assert([...titleRange.getClientRects()].every(rect => rect.right <= cartRect.left || rect.left >= cartRect.right || rect.bottom <= cartRect.top || rect.top >= cartRect.bottom), 'header text does not overlap cart at ' + width + 'px');
            const firstCards = [...d.querySelectorAll('.card:not([hidden])')].slice(0, 3);
            if (firstCards.length === 3) {
                const positions = firstCards.map(card => card.getBoundingClientRect());
                assert(positions.every(position => Math.abs(position.top - positions[0].top) < 1), 'first three cards share a row at ' + width + 'px');
                assert(positions[2].right <= width, 'third card fits viewport at ' + width + 'px');
            }
            toggle.click();
            assert(menu.getBoundingClientRect().right <= w.innerWidth, 'top category menu fits at ' + width + 'px');
            toggle.click();
            for (const selector of d.querySelectorAll('.variant-select')) {
                assert(selector.getBoundingClientRect().width <= selector.closest('.card').getBoundingClientRect().width, 'variant dropdown fits its card at ' + width + 'px');
            }
        }
        frame.style.width = '1280px';
        w.agregarAlCarrito(d.querySelector('.card button'));
        assert(d.getElementById('cart-count').textContent === '1', 'cart count updates');
        if (++index < pages.length) frame.src = '../' + pages[index] + '.html';
        else {
            w.vaciarCarrito();
            result.textContent = 'PASS: ' + checks + ' checks across ' + pages.length + ' pages (desktop and mobile)';
        }
    } catch (error) { fail(error); }
};
window.addEventListener('error', event => fail(event.message));
frame.src = '../index.html';
</script>
</body>
</html>
